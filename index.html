<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Calculator</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#101114;
  font-family:Arial,sans-serif;
}

.logo{
  position:fixed;
  top:14px;
  right:14px;
  width:55px;
  height:55px;
}

.logo img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.calculator{
  width:305px;
  padding:14px;
  border-radius:24px;
  background:linear-gradient(145deg,#f5f5f5,#c9c9c9);
  box-shadow:
    0 25px 60px rgba(0,0,0,.6),
    inset 0 1px 2px #fff;
}

.screen{
  height:108px;
  padding:9px;
  margin-bottom:12px;
  border-radius:15px;
  background:#c6d3a9;
  border:3px solid #555;
  box-shadow:inset 0 4px 10px rgba(0,0,0,.3);
  overflow:hidden;
}

#history{
  height:22px;
  text-align:right;
  font-size:12px;
  color:#4c5542;
  white-space:nowrap;
  overflow:hidden;
}

#display{
  height:62px;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  font-family:monospace;
  font-size:27px;
  color:#111;
  white-space:nowrap;
  overflow:hidden;
}

/* الأس */

.power{
  display:inline-flex;
  align-items:flex-start;
}

.powerBase{
  font-size:28px;
}

.powerBox{
  min-width:20px;
  min-height:20px;
  margin-left:3px;
  margin-top:-8px;
  padding:1px 4px;
  border:2px solid #333;
  border-radius:4px;
  background:#edf4da;
  font-size:16px;
  line-height:16px;
}

/* الكسر */

.mixed{
  display:inline-flex;
  align-items:center;
  gap:7px;
}

.fraction{
  display:inline-flex;
  flex-direction:column;
  align-items:center;
  min-width:35px;
  font-family:monospace;
}

.fracTop,
.fracBottom{
  min-width:28px;
  padding:2px 7px;
  text-align:center;
}

.fracLine{
  width:100%;
  height:2px;
  background:#111;
}

/* الأزرار */

.buttons{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

button{
  height:43px;
  border:0;
  border-radius:10px;
  background:linear-gradient(145deg,#fff,#d0d0d0);
  box-shadow:
    0 3px 0 #888,
    inset 0 1px 2px #fff;
  font-size:15px;
  font-weight:bold;
  color:#171717;
  cursor:pointer;
}

button:active{
  transform:translateY(3px);
  box-shadow:0 0 0 #888;
}

.function{
  font-size:13px;
  background:linear-gradient(145deg,#ededed,#c0c0c0);
}

.operator{
  font-size:19px;
}

.del{
  background:linear-gradient(145deg,#ffe8aa,#d5aa4b);
}

.ac{
  color:white;
  background:linear-gradient(145deg,#ff9f9f,#d35e5e);
}

.equal{
  color:white;
  background:linear-gradient(145deg,#444,#171717);
}

.arrows{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-top:9px;
}

.arrow{
  height:34px;
  font-size:18px;
  background:linear-gradient(145deg,#dedede,#b8b8b8);
}

.footer{
  margin-top:9px;
  text-align:center;
  font-size:8px;
  color:#666;
  letter-spacing:2px;
}
</style>
</head>

<body>

<a class="logo"
   href="https://ahmedhafezfrontend-ah13.netlify.app"
   target="_blank">
  <img src="logo.png" alt="Logo">
</a>

<div class="calculator">

  <div class="screen">
    <div id="history"></div>
    <div id="display">0</div>
  </div>

  <div class="buttons">

    <!-- الوظائف -->
    <button class="function" onclick="sqrt()">√</button>
    <button class="function" onclick="cbrt()">∛</button>
    <button class="function" onclick="square()">x²</button>
    <button class="function" onclick="powerStart()">xʸ</button>
    <button class="function" onclick="fractionStart()">a/b</button>

    <!-- وظائف إضافية -->
    <button class="function" onclick="insert('(')">(</button>
    <button class="function" onclick="insert(')')">)</button>
    <button class="function" onclick="scientific()">EXP</button>
    <button class="function" onclick="swapSD()">S⇔D</button>
    <button class="del" onclick="del()">DEL</button>

    <!-- أرقام -->
    <button onclick="insert('7')">7</button>
    <button onclick="insert('8')">8</button>
    <button onclick="insert('9')">9</button>
    <button class="operator" onclick="insert('÷')">÷</button>
    <button class="ac" onclick="clearAll()">AC</button>

    <button onclick="insert('4')">4</button>
    <button onclick="insert('5')">5</button>
    <button onclick="insert('6')">6</button>
    <button class="operator" onclick="insert('×')">×</button>
    <button class="function" onclick="sign()">+/−</button>

    <button onclick="insert('1')">1</button>
    <button onclick="insert('2')">2</button>
    <button onclick="insert('3')">3</button>
    <button class="operator" onclick="insert('−')">−</button>
    <button class="operator" onclick="insert('+')">+</button>

    <button onclick="insert('0')" style="grid-column:span 2">0</button>
    <button onclick="insert('.')">.</button>
    <button class="function" onclick="insert('%')">%</button>
    <button class="equal" onclick="calculate()">=</button>

  </div>

  <!-- الأسهم -->
  <div class="arrows">
    <button class="arrow" onclick="left()">←</button>
    <button class="arrow" onclick="up()">↑</button>
    <button class="arrow" onclick="down()">↓</button>
    <button class="arrow" onclick="right()">→</button>
  </div>

  <div class="footer">MODERN CALCULATOR</div>

</div>

<script>

/* ==============================
   الحالة
============================== */

let expression = "";
let cursor = 0;

let mode = "normal";

/* الأس */
let base = "";
let exponent = "";
let powerPart = "base";

/* الكسر */
let whole = "";
let numerator = "";
let denominator = "";
let fractionPart = "numerator";

let lastAnswer = null;

const display = document.getElementById("display");
const history = document.getElementById("history");


/* ==============================
   الشاشة
============================== */

function render(){

  /* الأس */
  if(mode === "power"){

    display.innerHTML = `
      <span class="power">
        <span class="powerBase">
          ${base || "□"}
        </span>

        <span class="powerBox">
          ${exponent || "□"}
        </span>
      </span>
    `;

    return;
  }


  /* الكسر */
  if(mode === "fraction"){

    display.innerHTML = `
      <span class="mixed">

        ${
          whole
          ? `<span>${whole}</span>`
          : ""
        }

        <span class="fraction">

          <span class="fracTop">
            ${numerator || "□"}
          </span>

          <span class="fracLine"></span>

          <span class="fracBottom">
            ${denominator || "□"}
          </span>

        </span>

      </span>
    `;

    return;
  }


  display.textContent =
    expression || "0";
}


/* ==============================
   إدخال
============================== */

function insert(v){

  /* الأس */
  if(mode === "power"){

    if(!/[0-9.]/.test(v)) return;

    if(powerPart === "base")
      base += v;
    else
      exponent += v;

    render();
    return;
  }


  /* الكسر */
  if(mode === "fraction"){

    if(!/[0-9.]/.test(v)) return;

    if(fractionPart === "whole")
      whole += v;

    else if(fractionPart === "numerator")
      numerator += v;

    else
      denominator += v;

    render();
    return;
  }


  expression += v;
  cursor = expression.length;

  render();
}


/* ==============================
   الجذر التربيعي
============================== */

function sqrt(){

  if(expression)
    expression = "√(" + expression + ")";
  else
    expression = "√(";

  render();
}


/* ==============================
   الجذر التكعيبي
============================== */

function cbrt(){

  if(expression)
    expression = "∛(" + expression + ")";
  else
    expression = "∛(";

  render();
}


/* ==============================
   x²
============================== */

function square(){

  if(!expression) return;

  expression =
    "(" + expression + ")²";

  render();
}


/* ==============================
   الأس
============================== */

function powerStart(){

  mode = "power";

  base = "";
  exponent = "";

  powerPart = "base";

  render();
}


/* ==============================
   الكسر
============================== */

function fractionStart(){

  mode = "fraction";

  whole = "";
  numerator = "";
  denominator = "";

  fractionPart = "numerator";

  render();
}


/* ==============================
   EXP
============================== */

function scientific(){

  if(mode !== "normal") return;

  if(!expression) return;

  expression += "e";

  render();
}


/* ==============================
   الحذف
============================== */

function del(){

  if(mode === "power"){

    if(powerPart === "base")
      base = base.slice(0,-1);
    else
      exponent = exponent.slice(0,-1);

    render();
    return;
  }


  if(mode === "fraction"){

    if(fractionPart === "whole")
      whole = whole.slice(0,-1);

    else if(fractionPart === "numerator")
      numerator = numerator.slice(0,-1);

    else
      denominator = denominator.slice(0,-1);

    render();
    return;
  }


  expression = expression.slice(0,-1);
  cursor = expression.length;

  render();
}


/* ==============================
   AC
============================== */

function clearAll(){

  expression = "";
  cursor = 0;

  mode = "normal";

  base = "";
  exponent = "";

  whole = "";
  numerator = "";
  denominator = "";

  lastAnswer = null;

  history.textContent = "";

  render();
}


/* ==============================
   +/-
============================== */

function sign(){

  if(mode === "power"){

    if(powerPart === "base")
      base = base.startsWith("-")
        ? base.slice(1)
        : "-" + base;

    else
      exponent = exponent.startsWith("-")
        ? exponent.slice(1)
        : "-" + exponent;

    render();
    return;
  }


  expression =
    expression.startsWith("-")
    ? expression.slice(1)
    : "-" + expression;

  render();
}


/* ==============================
   الأسهم
============================== */

function up(){

  if(mode === "power"){

    powerPart = "exponent";
    render();
    return;
  }

  if(mode === "fraction"){

    if(fractionPart === "denominator")
      fractionPart = "numerator";

    else if(fractionPart === "numerator")
      fractionPart = "whole";

    render();
  }
}


function down(){

  if(mode === "power"){

    powerPart = "base";
    render();
    return;
  }

  if(mode === "fraction"){

    if(fractionPart === "whole")
      fractionPart = "numerator";

    else if(fractionPart === "numerator")
      fractionPart = "denominator";

    render();
  }
}


function left(){

  if(mode === "power"){

    powerPart = "base";
    render();
    return;
  }

  if(mode === "fraction"){

    if(fractionPart === "denominator")
      fractionPart = "numerator";

    else if(fractionPart === "numerator")
      fractionPart = "whole";

    render();
    return;
  }

  cursor =
    Math.max(0,cursor-1);
}


function right(){

  if(mode === "power"){

    powerPart = "exponent";
    render();
    return;
  }

  if(mode === "fraction"){

    if(fractionPart === "whole")
      fractionPart = "numerator";

    else if(fractionPart === "numerator")
      fractionPart = "denominator";

    render();
    return;
  }

  cursor =
    Math.min(
      expression.length,
      cursor+1
    );
}


/* ==============================
   تجهيز الحساب
============================== */

function prepare(x){

  x = x.replaceAll("×","*");
  x = x.replaceAll("÷","/");
  x = x.replaceAll("−","-");

  x = x.replaceAll("²","**2");

  x = x.replaceAll("√(","Math.sqrt(");
  x = x.replaceAll("∛(","Math.cbrt(");

  x = x.replace(
    /(\d+(?:\.\d+)?)%/g,
    "($1/100)"
  );

  /* EXP */

  x = x.replace(
    /(\d+(?:\.\d+)?)e(-?\d+)/gi,
    "($1*10**$2)"
  );

  return x;
}


/* ==============================
   حساب الأس
============================== */

function calculatePower(){

  if(!base || !exponent){

    display.textContent =
      "أكمل الأس";

    return;
  }

  const b = Number(base);
  const e = Number(exponent);

  const result =
    Math.pow(b,e);

  history.textContent =
    base + "^" + exponent + " =";

  expression = String(result);

  lastAnswer = result;

  mode = "normal";

  render();
}


/* ==============================
   حساب الكسر
============================== */

function calculateFraction(){

  if(!numerator || !denominator){

    display.textContent =
      "أكمل الكسر";

    return;
  }

  const w = Number(whole || 0);
  const n = Number(numerator);
  const d = Number(denominator);

  if(d === 0){

    display.textContent =
      "Error";

    return;
  }

  const result =
    w + n/d;

  history.textContent =
    (whole ? whole + " " : "") +
    numerator + "/" +
    denominator +
    " =";

  expression = String(result);

  lastAnswer = result;

  mode = "normal";

  render();
}


/* ==============================
   الحساب العادي
============================== */

function calculate(){

  if(mode === "power"){
    calculatePower();
    return;
  }

  if(mode === "fraction"){
    calculateFraction();
    return;
  }

  if(!expression) return;

  try{

    let formula =
      prepare(expression);

    if(
      !/^[0-9+\-*/().%√∛²×÷−eE\s]+$/.test(
        expression
      )
    ){
      throw new Error();
    }

    let open =
      (formula.match(/\(/g)||[]).length;

    let close =
      (formula.match(/\)/g)||[]).length;

    while(close < open){
      formula += ")";
      close++;
    }

    const result =
      Function(
        '"use strict";return (' +
        formula +
        ')'
      )();

    if(!Number.isFinite(result))
      throw new Error();

    const rounded =
      Number(
        Number(result).toPrecision(12)
      );

    history.textContent =
      expression + " =";

    expression =
      String(rounded);

    lastAnswer =
      rounded;

    render();

  }catch(e){

    display.textContent =
      "Error";
  }
}


/* ==============================
   S ⇔ D
============================== */

function swapSD(){

  if(lastAnswer === null){

    calculate();

    if(lastAnswer === null)
      return;
  }

  let value =
    lastAnswer;

  let bestN = 0;
  let bestD = 1;
  let bestError = Infinity;

  for(let d=1;d<=10000;d++){

    let n =
      Math.round(value*d);

    let error =
      Math.abs(value-n/d);

    if(error < bestError){

      bestError = error;

      bestN = n;
      bestD = d;
    }

    if(error < 1e-10)
      break;
  }

  function gcd(a,b){

    a=Math.abs(a);
    b=Math.abs(b);

    while(b){

      let t=a%b;
      a=b;
      b=t;
    }

    return a;
  }

  let g =
    gcd(bestN,bestD);

  bestN /= g;
  bestD /= g;

  mode = "fraction";

  whole = "";
  numerator = String(bestN);
  denominator = String(bestD);

  fractionPart = "numerator";

  render();
}


/* ==============================
   بداية
============================== */

render();

</script>

</body>
</html>
